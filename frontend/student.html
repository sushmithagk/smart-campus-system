<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h2>
            🎓 Student Dashboard
        </h2>

        <p class="subtitle">
            Manage complaints, track maintenance
            requests, and stay updated easily.
        </p>

        <!-- DASHBOARD CARDS -->

        <div class="dashboard-grid">

            <a href="raise.html" class="dashboard-card">

                <div class="icon">
                    📝
                </div>

                <h3>
                    Raise Complaint
                </h3>

                <p>
                    Submit new maintenance or campus complaints.
                </p>

            </a>

            <a href="track.html" class="dashboard-card">

                <div class="icon">
                    📌
                </div>

                <h3>
                    Track Status
                </h3>

                <p>
                    View complaint progress and status updates.
                </p>

            </a>

        </div>

        <button class="logout-btn"
                onclick="logout()">

            🚪 Logout

        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
