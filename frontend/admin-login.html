<!DOCTYPE html>
<html>

<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>Admin Login</h2>

        <input 
            type="text"
            id="adminUsername"
            placeholder="Enter Username"
        >

        <input 
            type="password"
            id="adminPassword"
            placeholder="Enter Password"
        >

        <button onclick="adminLogin()">
            Login
        </button>

        <a href="index.html">
            <button>
                Back
            </button>
        </a>

    </div>

    <script src="script.js"></script>

</body>

</html>
