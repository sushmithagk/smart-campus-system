<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h2>
            🎓 Student Login
        </h2>

        <p class="subtitle">
            Access your campus complaint dashboard
            and manage requests easily.
        </p>

        <input 
            type="email"
            id="email"
            placeholder="Enter Email"
        >

        <input 
            type="password"
            id="password"
            placeholder="Enter Password"
        >

        <button onclick="studentLogin()">
            Login
        </button>

        <p class="register-text">

            New Student?

            <a href="register.html">
                Register Here
            </a>

        </p>

        <a href="index.html">

            <button class="secondary-btn">
                ⬅ Back to Home
            </button>

        </a>

    </div>

    <script src="script.js"></script>

</body>

</html>
